<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarefa</title>
    <!-- Importando a fonte Open Sans do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
<div class="container">
    <div class="left-column">
        <h2>Editar Tarefa</h2>
        <form method="POST" action="{{ url_for('update_task', task_id=task.id) }}">
            <div class="form-group">
                <label for="title">Título</label>
                <input type="text" id="title" name="title" value="{{ task.title }}" required>
            </div>
            <div class="form-group">
                <label for="description">Descrição</label>
                <textarea id="description" name="description">{{ task.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="due_date">Data de Vencimento</label>
                <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}">
            </div>
            <div class="form-group">
                <label for="priority">Prioridade</label>
                <select id="priority" name="priority">
                    <option value="High" {% if task.priority == 'High' %}selected{% endif %}>Alta</option>
                    <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Média</option>
                    <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Baixa</option>
                </select>
            </div>
            <div class="form-group">
                <button type="submit">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
